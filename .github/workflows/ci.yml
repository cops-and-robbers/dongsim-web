name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # 페이지 구성과 어긋나면 조용히 낡는 목록들 - 로컬에서만 돌리다
      # main이 초록인 채로 어긋난 적이 있어 CI 에 둔다 (#92)
      - name: Check ko-only paths
        run: pnpm run check:ko-only

      - name: Check legal font subsets
        run: pnpm run check:legal-fonts

      - name: Build
        run: pnpm run build

  # 필수 검사(verify)에서 분리했다. 가장 오래 걸리는 단계라 머지를 기다리게 했고, 점수나 일시적 실패로 머지를 막았다.
  # 결과는 계속 남기되 실패해도 워크플로 전체를 실패로 치지 않는다
  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
