# 블로그 자동 동기화 (#109 3단계).
#
# 화면이 노션이 아니라 DB만 읽으므로, 동기화가 돌지 않으면 새 글이 영영 뜨지
# 않는다. 어드민의 수동 버튼과 별개로 30분마다 한 번씩 돌려, 버튼을 몰라도
# 글이 늦어도 30분 안에는 발행되게 한다.
#
# Vercel 크론은 Hobby 플랜에서 하루 1회 제한이라 여기서 돌린다.
# 시크릿(BLOG_SYNC_SECRET)은 저장소 Actions 시크릿에 있다 - Vercel 의
# SYNC_SECRET 과 같은 값이어야 한다.
name: blog-sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 동기화 호출
        run: |
          code=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            "https://copsandrobbers.app/api/blog/sync" \
            -H "Authorization: Bearer ${{ secrets.BLOG_SYNC_SECRET }}")
          cat response.json
          echo
          echo "HTTP $code"
          test "$code" = "200"
